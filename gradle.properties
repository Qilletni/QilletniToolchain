# Centralized version and dependency-pin properties for QilletniToolchain.
# See `.qilletni/release.yml` and `RELEASE.md` for the release process.

# QilletniToolchain's own release version (the `qilletni-toolchain` release unit,
# registered as such in the central `release/components.yml` of `Qilletni/Qilletni`).
toolchainVersion=1.0.2-SNAPSHOT

# Aligned version of the `dev.qilletni.impl:qilletni` and `dev.qilletni.api:qilletni-api`
# dependencies, which are always released together at the same version (see
# `qilletni-core` in `release/components.yml` of `Qilletni/Qilletni`). Kept as a single
# property so both coordinates are bumped together, never independently.
qilletniCoreVersion=1.0.1

# `dev.qilletni.pkgutil:qilletni-pkgutil` (see `qilletni-pkgutil` in `release/components.yml`)
qilletniPkgutilVersion=1.0.0

# `dev.qilletni.docgen:qilletni-docgen` (see `qilletni-docgen` in `release/components.yml`)
qilletniDocgenVersion=1.0.0

# Sibling composite-build substitution (../Qilletni, ../QilletniPackageUtility,
# ../QilletniDocgen) is opt-in only - never enabled implicitly just because a sibling
# checkout directory happens to exist. Set to `true` (e.g. `-PincludeSiblingBuilds=true`)
# for local multi-repo development. Stable CI/release builds always force this off.
includeSiblingBuilds=false

# `mavenLocal()` is excluded from default release/CI dependency resolution.
# Enable with `-PuseMavenLocal=true`.
useMavenLocal=false
